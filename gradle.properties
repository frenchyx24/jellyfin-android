# Gradle
org.gradle.jvmargs=-Xmx3072m -Djava.awt.headless=true

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default

# Nflix release version (CI overrides it with the JELLYFIN_VERSION environment variable)
jellyfin.version=5.1.0
